services:
  db:
    image: postgres:18
    container_name: ap-database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: autopred
    volumes:
      - pgdata:/var/lib/postgresql/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
    ports:
      - "5432:5432"
volumes:
  pgdata:
