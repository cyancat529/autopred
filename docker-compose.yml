services:
  db:
    image: postgres:18
    container_name: ap-database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: autopred
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/pgdata:/var/lib/postgresql/    
    ports:
      - "5432:5432"
  scrapper:
    build: ./scrapper
    container_name: ap-scrapper
    ports:
      - "5000:5000"
    command: tail -f /dev/null
    volumes:         
      - ./scrapper:/app
    depends_on:
      - db                                                                

volumes:
  pgdata: